plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'idea'
    id "com.github.ben-manes.versions" version "0.56.0"
    id 'checkstyle'
    id "com.autonomousapps.dependency-analysis" version "3.18.0"
    // Publishes to Maven Central via the new Central Publisher Portal
    // (OSSRH was shut down 2025-06-30). Applies the maven-publish and
    // signing plugins internally and adds sources/javadoc jars for us.
    id "com.vanniktech.maven.publish" version "0.37.0"
}

// The version is driven by the git tag at release time: the publish workflow
// passes the release tag via -PreleaseVersion (see .github/workflows/publish.yml).
// A leading "v" (e.g. v0.2.0) is stripped. Local/CI builds without the property
// fall back to a -SNAPSHOT so they can never be mistaken for a real release.
version = (findProperty('releaseVersion') ?: '0.1.2-SNAPSHOT').toString().replaceFirst(/^v/, '')

sourceCompatibility = 11
targetCompatibility = 11

// The maven-publish plugin (Vanniktech) requires a Java 17+ JVM to *run*
// Gradle, so CI now builds on JDK 17. `release` guarantees the compiled
// bytecode and API surface stay Java 11 compatible regardless of the JDK.
tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

rootProject.description = 'Read and Write Podcast feeds from Java.'

group = 'co.ntbl'

tasks.register('createProperties') {
    doLast {
        new File("$projectDir/src/main/resources/version.properties").withWriter { w ->
            Properties p = new Properties()
            p['version'] = project.version.toString()
            p.store w, null
        }
    }
}

classes {
    dependsOn createProperties
}

jar {
    manifest {
        attributes(
                "Class-Path": "co.ntbl.podcastfeedhandler",
                "Main-Class": "PodcastFeedHandler",
                "Implementation-Title": project.name,
                "Implementation-Version": version,
                "Implementation-Vendor": "Daniel Berkowitz",
                "Build-Jdk": org.gradle.internal.jvm.Jvm.current(),
                "Gradle-Version": GradleVersion.current().toString()
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

test {
//    minHeapSize = "256m" // initial heap size
//    maxHeapSize = "1024m" // maximum heap size
    testLogging {
        // Make sure output from
        // standard out or error is shown
        // in Gradle output.
        showStandardStreams = true

        // Or we use events method:
        // events 'standard_out', 'standard_error'

        // Or set property events:
        // events = ['standard_out', 'standard_error']

        // Instead of string values we can
        // use enum values:
        // events org.gradle.api.tasks.testing.logging.TestLogEvent.STANDARD_OUT,
        //  org.gradle.api.tasks.testing.logging.TestLogEvent.STANDARD_ERROR,
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.2'
    testImplementation group: 'com.icosillion.podengine', name: 'podengine', version: '2.4.1'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// To accept gradle scans and publish them
if (hasProperty('buildScan')) {
    buildScan {
        termsOfServiceUrl = 'https://gradle.com/terms-of-service'
        termsOfServiceAgree = 'yes'
    }
}

//
// MAVEN CENTRAL (Central Publisher Portal)
//
// Credentials and the signing key are supplied via Gradle properties /
// environment variables (see .github/workflows/publish.yml):
//   ORG_GRADLE_PROJECT_mavenCentralUsername / mavenCentralPassword
//       -> a Central Portal *user token* (Account -> Generate User Token),
//          NOT your portal login and NOT the old OSSRH token.
//   ORG_GRADLE_PROJECT_signingInMemoryKey / signingInMemoryKeyPassword
//       -> the ASCII-armored GPG private key and its passphrase.
//

mavenPublishing {
    // Upload to the Central Portal and automatically release once validation
    // passes. Set to false if you'd rather click "Publish" in the web UI.
    publishToMavenCentral(true)
    signAllPublications()

    coordinates(group.toString(), 'podcastfeedhandler', version.toString())

    pom {
        name = 'PodcastFeedHandler'
        description = rootProject.description
        url = 'https://github.com/daberkow/PodcastFeedHandler'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/daberkow/PodcastFeedHandler/blob/main/LICENSE'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'daberkow'
                name = 'Daniel Berkowitz'
                email = 'dansberkowitz@gmail.com'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/daberkow/PodcastFeedHandler.git'
            developerConnection = 'scm:git:ssh://git@github.com:daberkow/PodcastFeedHandler.git'
            url = 'https://github.com/daberkow/PodcastFeedHandler'
        }
    }
}
