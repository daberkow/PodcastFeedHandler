name: Publish package to the Maven Central Repository and GitHub Packages
on:
  release:
    types: [published]
jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6
      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3
      - name: Publish to Maven Central (Central Portal)
        # The release tag (e.g. 0.2.0 or v0.2.0) becomes the artifact version;
        # build.gradle strips any leading "v". This is the single source of
        # truth for the version — no manual edit of build.gradle is needed.
        run: ./gradlew publishToMavenCentral --no-configuration-cache -PreleaseVersion=${{ github.event.release.tag_name }}
        env:
          # Central Portal user token (Account -> Generate User Token).
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # ASCII-armored GPG private key + passphrase used to sign artifacts.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSPHRASE }}

      # - name: Publish artifact
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #   # The GITHUB_REF tag comes in the format 'refs/tags/xxx'.
      #   # If we split on '/' and take the 3rd value,
      #   # we can get the release name.
      #   run: |
      #     NEW_VERSION=$(echo "${GITHUB_REF}" | cut -d "/" -f3)
      #     echo "New version: ${NEW_VERSION}"
      #     echo "Github username: ${GITHUB_ACTOR}"
      #     ./gradlew -Pversion=${NEW_VERSION} publish